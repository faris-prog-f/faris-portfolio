
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Faris Portfolio</title>

  <style>
    body {
      margin: 0;
      background: #0d0d0d;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    .card {
      background: #161616;
      padding: 40px;
      border-radius: 20px;
      width: 90%;
      max-width: 600px;
      box-shadow: 0 0 40px rgba(255,255,255,0.05);
    }

    h1 {
      font-size: 48px;
      margin-bottom: 10px;
    }

    p {
      color: #b3b3b3;
      line-height: 1.8;
    }

    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 14px 28px;
      background: white;
      color: black;
      text-decoration: none;
      border-radius: 12px;
      font-weight: bold;
    }

    .btn:hover {
      opacity: 0.8;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>Faris</h1>

    <p>
      Front Desk Professional<br>
      Passionate about hospitality, communication, and technology.
    </p>

    <a class="btn" href="#">
      View Resume
    </a>
  </div>

</body>
</html>
